name: kolladesk-dev

services:
  postgres:
    image: postgres:18
    container_name: kolladesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      # Wichtig: Postgres 18 erwartet das Volume unter /var/lib/postgresql
      # (NICHT mehr unter /.../data) - sonst werden Daten nicht persistiert.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kolladesk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3-API (hier spricht dein Backend mit MinIO)
      - "9001:9001" # Web-Konsole (Objekt-Browser)
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: kolladesk-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (hier schickt dein Backend Mails hin)
      - "8025:8025" # Web-UI (hier siehst du die Mails)

volumes:
  postgres_data:
  minio_data:
